services:
  remote-code:
    build:
      context: .
      dockerfile: Dockerfile
    image: remote-code:latest
    container_name: remote-code
    restart: unless-stopped

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      HTTP_ADDR: ":8000"
      TASK_PROCESSING_TIME: "2s"
      SHUTDOWN_TIMEOUT: "10s"

    user: "65532:65532"

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    mem_limit: 256m
    mem_reservation: 128m
    cpus: "1.0"

